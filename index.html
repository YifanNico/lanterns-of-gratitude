<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050810" />
  <title>LANTERNS OF GRATITUDE</title>
  <style>
    :root { color-scheme: dark; --gold: #f7c879; --muted: #c8bbac; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050810; }
    body {
      background:
        radial-gradient(ellipse at 50% 42%, rgba(35, 30, 72, .58) 0%, rgba(14, 17, 43, .40) 32%, rgba(5, 8, 16, .12) 69%),
        radial-gradient(ellipse at 50% 100%, #101024 0%, #080b18 43%, #050810 78%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff8ec;
    }
    #stage { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 2; background: radial-gradient(ellipse at center, transparent 45%, rgba(2, 3, 11, .18) 75%, rgba(1, 2, 8, .58) 120%); }
    .title {
      position: fixed; z-index: 3; top: clamp(22px, 5.4vh, 56px); left: 50%; transform: translateX(-50%);
      width: min(94vw, 720px); text-align: center; pointer-events: none;
      text-shadow: 0 0 28px rgba(255, 182, 91, .18);
    }
    .eyebrow { margin: 0 0 12px; color: rgba(255, 224, 178, .74); font-size: 9px; letter-spacing: .48em; text-transform: uppercase; }
    h1 { margin: 0; font-family: "Times New Roman", Georgia, serif; font-weight: 400; font-size: clamp(23px, 4vw, 42px); letter-spacing: .22em; line-height: 1.15; }
    .subtitle { margin: 12px auto 0; color: rgba(234, 221, 209, .62); font-family: Georgia, serif; font-size: clamp(11px, 1.4vw, 14px); font-style: italic; letter-spacing: .1em; }
    .footer { position: fixed; z-index: 3; bottom: max(20px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: min(92vw, 680px); text-align: center; pointer-events: none; }
    .footer p { margin: 0; color: rgba(231, 219, 210, .60); font-size: 10px; letter-spacing: .24em; text-transform: uppercase; }
    .footer .rule { height: 1px; width: 42px; margin: 0 auto 13px; background: linear-gradient(90deg, transparent, rgba(248, 197, 120, .62), transparent); }
    .hint { position: fixed; z-index: 3; right: 23px; bottom: 23px; color: rgba(232, 219, 206, .36); font-size: 9px; letter-spacing: .14em; pointer-events: none; }
    .camera-toggle {
      position: fixed; z-index: 6; top: max(22px, env(safe-area-inset-top)); right: max(24px, env(safe-area-inset-right));
      padding: 11px 15px; border: 1px solid rgba(248, 207, 145, .38); border-radius: 999px;
      background: rgba(9, 11, 25, .42); color: rgba(255, 239, 213, .88); backdrop-filter: blur(12px);
      font: 9px/1 Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase;
      cursor: pointer; transition: background .2s ease, border-color .2s ease, opacity .2s ease;
    }
    .camera-toggle:hover { background: rgba(38, 30, 44, .7); border-color: rgba(255, 222, 164, .72); }
    .camera-toggle:disabled { cursor: wait; opacity: .58; }
    .debug-panel {
      position: fixed; z-index: 5; top: 20px; left: 20px; width: min(260px, calc(100vw - 40px));
      padding: 13px 15px 14px; border: 1px solid rgba(245, 205, 141, .18); border-radius: 10px;
      background: rgba(5, 8, 18, .52); backdrop-filter: blur(12px); color: rgba(246, 231, 211, .8);
      font: 10px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .035em;
    }
    .debug-heading { display: flex; justify-content: space-between; margin-bottom: 6px; color: rgba(248, 202, 128, .84); font: 9px/1.4 Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; }
    .debug-row { display: flex; justify-content: space-between; gap: 12px; white-space: nowrap; }
    .debug-row span:first-child { color: rgba(219, 210, 203, .54); }
    .debug-row span:last-child { color: rgba(255, 244, 227, .92); text-align: right; }
    .debug-row .error { color: #ff927e !important; }
    #cameraVideo { position: fixed; z-index: -1; left: -10000px; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
    @media (max-width: 600px) { .eyebrow { letter-spacing: .34em; } h1 { letter-spacing: .14em; } .hint { display: none; } }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div id="stage" aria-label="A field of glowing gratitude lanterns drifting through a night sky"></div>
  <header class="title">
    <p class="eyebrow">A gathering of light · Thanksgiving</p>
    <h1>LANTERNS OF GRATITUDE</h1>
    <p class="subtitle">For all that warms the heart, and all that carries us forward.</p>
  </header>
  <div class="footer"><div class="rule"></div><p>May every grateful thought find its way home</p></div>
  <div class="hint">DRAG TO EXPLORE</div>
  <button id="cameraToggle" class="camera-toggle" type="button" aria-pressed="false">Enable Camera</button>
  <aside id="debugPanel" class="debug-panel" aria-live="polite">
    <div class="debug-heading"><span>Hand Tracking</span><span>LOCAL</span></div>
    <div class="debug-row"><span>Camera</span><span id="debugCamera">OFF</span></div>
    <div class="debug-row"><span>Hands</span><span id="debugHands">0</span></div>
    <div class="debug-row"><span>Gesture</span><span id="debugGesture">NO HAND</span></div>
    <div class="debug-row"><span>Palm Position</span><span id="debugPalm">—</span></div>
    <div class="debug-row"><span>Hold Time</span><span id="debugHold">0.0 s</span></div>
    <div class="debug-row"><span>FPS</span><span id="debugFps">—</span></div>
    <div class="debug-row"><span>Interaction</span><span id="debugInteraction">IDLE</span></div>
  </aside>
  <video id="cameraVideo" autoplay muted playsinline></video>
  <div class="vignette"></div>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
    import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';

    // Central art-direction and performance controls. Lower qualityScale for slower devices.
    const CONFIG = {
      mainLanternParticles: 36000,
      backgroundLanterns: 76,
      backgroundParticlesPerLantern: [220, 760],
      environmentParticles: 24000,
      mainLanternHeight: 8.2,
      mainLanternWidth: 4.9,
      particleSize: 1.0,
      environmentParticleSize: 0.75,
      colors: {
        night: '#050810', flame: '#FFF5D6', brightGold: '#FFE09A',
        amber: '#FFB347', candle: '#FF9F43', outer: '#FF8533', champagne: '#FBC96B',
        topOrange: '#D96A32', maple: '#B94A32', highlight: '#FFF8E7'
      },
      floatSpeed: 0.34,
      autoRotateSpeed: 0.055,
      bloomStrength: 0.82,
      bloomRadius: 0.72,
      bloomThreshold: 0.16,
      qualityScale: 1,
      maxPixelRatio: 1.8,
      backgroundDepth: [24, 94],
      starFieldRadius: 92,
      DEBUG: true,
      handDetectionIntervalMs: 70,
      gestureStabilityMs: 160,
      openHoldMs: 800,
      handLossGraceMs: 260,
      handLostEventMs: 1500,
      handExitRearmMs: 600,
      positionSmoothing: 10
    };

    const stage = document.querySelector('#stage');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x090b1c, 0.0042);
    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 260);
    camera.position.set(0, 5.0, 29);
    camera.lookAt(0, 3.0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, CONFIG.maxPixelRatio) * CONFIG.qualityScale);
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.setClearColor(0x050810, 0);
    stage.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.0, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.035;
    controls.enablePan = false;
    controls.minDistance = 23;
    controls.maxDistance = 43;
    controls.minPolarAngle = Math.PI * 0.27;
    controls.maxPolarAngle = Math.PI * 0.62;
    controls.autoRotate = true;
    controls.autoRotateSpeed = CONFIG.autoRotateSpeed;

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), CONFIG.bloomStrength, CONFIG.bloomRadius, CONFIG.bloomThreshold);
    bloom.strength = CONFIG.bloomStrength;
    bloom.radius = CONFIG.bloomRadius;
    bloom.threshold = CONFIG.bloomThreshold;
    composer.addPass(bloom);

    const vertexShader = `
      uniform float uTime;
      uniform float uPixelRatio;
      uniform float uSize;
      uniform vec3 uHandPos;
      attribute float aRandom;
      attribute float aSize;
      attribute float aPhase;
      attribute float aLayer;
      attribute float aSpeed;
      attribute vec3 aColor;
      varying vec3 vColor;
      varying float vAlpha;
      varying float vRandom;
      varying float vLayer;
      varying float vHeight;
      void main() {
        vec3 p = position;
        float t = uTime;
        float phase = aPhase + aRandom * 6.28318;
        float energy = 0.5 + 0.5 * sin(t * 1.35 - p.y * 1.25 + phase * 0.17);
        float slowWave = sin(t * 0.47 + p.y * 0.66 + phase) * 0.075;
        float fineWave = sin(t * 1.17 + p.x * 1.9 + p.z * 1.4 + phase) * 0.035;
        float breath = sin(t * 1.1 + phase * 0.5) * 0.045;
        float sway = sin(t * 0.33 + p.y * 0.24) * 0.12;
        p.x += sway + slowWave + fineWave;
        p.z += cos(t * 0.31 + p.y * 0.3) * 0.085 + sin(t * 0.8 + phase) * 0.035;
        p.y += sin(t * (0.45 + aSpeed * 0.35) + phase) * (0.045 + 0.04 * aRandom) + breath;
        vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        float perspective = 82.0 / max(1.0, -mvPosition.z);
        float shimmer = 0.84 + 0.16 * sin(t * (1.4 + aSpeed) + phase);
        gl_PointSize = clamp(aSize * uSize * uPixelRatio * perspective * shimmer, 0.7, 17.0);
        vColor = aColor * (0.75 + 0.42 * energy);
        if (aRandom > 0.985) vColor = mix(vColor, vec3(1.0, 0.96, 0.83), 0.68);
        vAlpha = (0.62 + 0.32 * energy) * (0.76 + 0.24 * sin(t * 1.9 + phase));
        vRandom = aRandom;
        vLayer = aLayer;
        vHeight = p.y;
      }
    `;
    const fragmentShader = `
      varying vec3 vColor;
      varying float vAlpha;
      varying float vRandom;
      varying float vLayer;
      varying float vHeight;
      void main() {
        vec2 uv = gl_PointCoord - 0.5;
        float r = length(uv) * 2.0;
        float core = exp(-r * r * 17.0);
        float halo = exp(-r * r * 5.4);
        float softEdge = smoothstep(1.0, 0.12, r);
        float sparkle = 0.84 + 0.16 * sin(vRandom * 437.0 + vHeight * 19.0);
        float layerGain = mix(0.78, 1.5, clamp(vLayer, 0.0, 1.0));
        float alpha = (core * 0.88 + halo * 0.34) * softEdge * vAlpha * sparkle * layerGain;
        if (alpha < 0.012) discard;
        vec3 color = vColor * (0.68 + core * 1.7);
        gl_FragColor = vec4(color, alpha);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `;
    const particleMaterial = (size, opacity = 1) => new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() }, uSize: { value: size }, uHandPos: { value: new THREE.Vector3() } },
      vertexShader, fragmentShader, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, opacity, toneMapped: true
    });

    // Camera and hand-tracking state. Detection runs from decoded video-frame callbacks,
    // independently from the Three.js render loop; all inference stays in this browser tab.
    const cameraToggle = document.querySelector('#cameraToggle');
    const cameraVideo = document.querySelector('#cameraVideo');
    const debugPanel = document.querySelector('#debugPanel');
    const debugEls = {
      camera: document.querySelector('#debugCamera'), hands: document.querySelector('#debugHands'),
      gesture: document.querySelector('#debugGesture'), palm: document.querySelector('#debugPalm'),
      hold: document.querySelector('#debugHold'), fps: document.querySelector('#debugFps'),
      interaction: document.querySelector('#debugInteraction')
    };
    debugPanel.hidden = !CONFIG.DEBUG;
    let cameraState = 'OFF';
    let cameraError = '';
    let cameraStream = null;
    let handLandmarker = null;
    let cameraGeneration = 0;
    let cameraFrameHandle = null;
    let lastVideoTime = -1;
    let lastDetectionAt = 0;
    let lastTimestampMs = 0;
    let handCount = 0;
    let displayedGesture = 'NO HAND';
    let candidateGesture = 'UNKNOWN';
    let candidateGestureAt = 0;
    let stableGesture = 'UNKNOWN';
    let openSince = 0;
    let openEventSent = false;
    let handLostSent = false;
    let lastHandSeenAt = 0;
    let lastHandTargetAt = 0;
    let lastInteractionEventAt = 0;
    let interactionState = 'IDLE';
    let lastNormalizedPalm = null;
    let lastPalmTarget = new THREE.Vector3();
    let hasPalmTarget = false;
    let palmHistory = [];
    const palmTargetWorld = new THREE.Vector3();
    const palmSmoothedWorld = new THREE.Vector3();
    const handMarker = new THREE.Mesh(
      new THREE.SphereGeometry(0.105, 16, 12),
      new THREE.MeshBasicMaterial({ color: 0xffdc91, transparent: true, opacity: 0.94, blending: THREE.AdditiveBlending })
    );
    handMarker.visible = false;
    scene.add(handMarker);
    const handHalo = new THREE.Mesh(
      new THREE.SphereGeometry(0.24, 16, 12),
      new THREE.MeshBasicMaterial({ color: 0xffba59, transparent: true, opacity: 0.16, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    handHalo.visible = false;
    scene.add(handHalo);
    const raycaster = new THREE.Raycaster();
    const interactionPlane = new THREE.Plane();
    const interactionPlaneNormal = new THREE.Vector3();
    const interactionPlanePoint = new THREE.Vector3();
    const rayHit = new THREE.Vector3();
    const tempPalm = new THREE.Vector3();
    const lastFramePalm = new THREE.Vector3();
    let holdDurationMs = 0;
    let fpsFrames = 0;
    let fpsLastAt = performance.now();
    let currentFps = 0;
    let lastDebugUpdateAt = 0;

    function setCameraState(state, error = '') {
      cameraState = state;
      cameraError = error;
      cameraToggle.setAttribute('aria-pressed', String(state === 'ON' || state === 'LOADING'));
      cameraToggle.textContent = state === 'ON' ? 'Disable Camera' : state === 'LOADING' ? 'Loading…' : 'Enable Camera';
      cameraToggle.disabled = state === 'LOADING';
      debugEls.camera.textContent = error ? `${state}: ${error}` : state;
      debugEls.camera.classList.toggle('error', state === 'ERROR');
      updateDebug();
    }
    function setInteractionState(state) {
      interactionState = state;
      if (CONFIG.DEBUG) debugEls.interaction.textContent = state;
    }
    function updateDebug() {
      if (!CONFIG.DEBUG) return;
      const now = performance.now();
      if (now - lastDebugUpdateAt < 90) return;
      lastDebugUpdateAt = now;
      debugEls.camera.textContent = cameraError ? `${cameraState} · ${cameraError}` : cameraState;
      debugEls.camera.classList.toggle('error', cameraState === 'ERROR');
      debugEls.hands.textContent = String(handCount);
      debugEls.gesture.textContent = displayedGesture;
      debugEls.palm.textContent = hasPalmTarget ? `${palmSmoothedWorld.x.toFixed(2)}, ${palmSmoothedWorld.y.toFixed(2)}, ${palmSmoothedWorld.z.toFixed(2)}` : '—';
      debugEls.hold.textContent = `${(holdDurationMs / 1000).toFixed(1)} s`;
      debugEls.fps.textContent = currentFps ? String(currentFps) : '—';
      debugEls.interaction.textContent = interactionState;
    }

    function emitInteraction(name, detail = {}) {
      const now = performance.now();
      if (name !== 'PALM_OPEN' && name !== 'PALM_CLOSED' && now - lastInteractionEventAt < 420) return;
      lastInteractionEventAt = now;
      setInteractionState(name);
      window.dispatchEvent(new CustomEvent(name, { detail: { ...detail, at: now, palmWorld: palmSmoothedWorld.clone() } }));
    }

    function distance3(a, b) {
      const dx = a.x - b.x, dy = a.y - b.y, dz = (a.z || 0) - (b.z || 0);
      return Math.hypot(dx, dy, dz);
    }
    function jointAngleDegrees(a, b, c) {
      const ab = { x: a.x - b.x, y: a.y - b.y, z: (a.z || 0) - (b.z || 0) };
      const cb = { x: c.x - b.x, y: c.y - b.y, z: (c.z || 0) - (b.z || 0) };
      const denom = Math.hypot(ab.x, ab.y, ab.z) * Math.hypot(cb.x, cb.y, cb.z);
      if (denom < 1e-6) return 0;
      const cosine = THREE.MathUtils.clamp((ab.x * cb.x + ab.y * cb.y + ab.z * cb.z) / denom, -1, 1);
      return Math.acos(cosine) * 180 / Math.PI;
    }
    function classifyHand(landmarks) {
      const palmIds = [0, 5, 9, 13, 17];
      const palm = palmIds.reduce((sum, id) => ({ x: sum.x + landmarks[id].x / palmIds.length, y: sum.y + landmarks[id].y / palmIds.length, z: sum.z + landmarks[id].z / palmIds.length }), { x: 0, y: 0, z: 0 });
      const palmWidth = distance3(landmarks[5], landmarks[17]);
      const wristToMcp = distance3(landmarks[0], landmarks[9]);
      const handScale = Math.max(palmWidth * 0.72, wristToMcp * 0.86, 1e-4);
      const fingers = [[5, 6, 8], [9, 10, 12], [13, 14, 16], [17, 18, 20]];
      let extended = 0, curled = 0;
      for (const [base, pip, tip] of fingers) {
        const angle = jointAngleDegrees(landmarks[base], landmarks[pip], landmarks[tip]);
        const reach = distance3(landmarks[tip], palm) / handScale;
        if (angle >= 145 && reach >= 1.28) extended++;
        else if (angle <= 128 || reach <= 1.02) curled++;
      }
      const gesture = extended === 4 ? 'OPEN' : curled >= 3 ? 'CLOSED' : 'UNKNOWN';
      return { gesture, palm };
    }

    function mapPalmToWorld(palm) {
      // MediaPipe sees the raw, unmirrored camera image. Mirror X to match a selfie preview,
      // then account for the centered cover-crop between the camera and canvas aspect ratios.
      let displayX = 1 - palm.x;
      let displayY = palm.y;
      const videoAspect = cameraVideo.videoWidth / cameraVideo.videoHeight;
      const canvasAspect = renderer.domElement.clientWidth / renderer.domElement.clientHeight;
      if (Number.isFinite(videoAspect) && videoAspect > 0) {
        if (videoAspect > canvasAspect) {
          const visibleWidth = canvasAspect / videoAspect;
          displayX = (displayX - (1 - visibleWidth) * 0.5) / visibleWidth;
        } else {
          const visibleHeight = videoAspect / canvasAspect;
          displayY = (displayY - (1 - visibleHeight) * 0.5) / visibleHeight;
        }
      }
      const ndcX = THREE.MathUtils.clamp(displayX, 0, 1) * 2 - 1;
      const ndcY = 1 - THREE.MathUtils.clamp(displayY, 0, 1) * 2;
      camera.updateMatrixWorld();
      raycaster.setFromCamera(new THREE.Vector2(ndcX, ndcY), camera);
      camera.getWorldDirection(interactionPlaneNormal);
      interactionPlanePoint.copy(camera.position).addScaledVector(interactionPlaneNormal, 18);
      interactionPlane.setFromNormalAndCoplanarPoint(interactionPlaneNormal, interactionPlanePoint);
      if (!raycaster.ray.intersectPlane(interactionPlane, rayHit)) return null;
      return { world: rayHit.clone(), screen: { x: displayX, y: displayY } };
    }

    function processPalmMotion(screen, world, now) {
      palmHistory.push({ x: screen.x, y: screen.y, world: world.clone(), at: now });
      while (palmHistory.length && now - palmHistory[0].at > 900) palmHistory.shift();
      const baseline = palmHistory.find((sample) => now - sample.at >= 260) || palmHistory[0];
      if (!baseline || now - baseline.at < 180) return;
      const duration = (now - baseline.at) / 1000;
      const dx = screen.x - baseline.x;
      const dy = screen.y - baseline.y;
      const speed = Math.hypot(dx, dy) / Math.max(duration, 0.01);
      if (speed > 0.42 && Math.abs(dx) > 0.15) emitInteraction(dx < 0 ? 'PALM_SWIPE_LEFT' : 'PALM_SWIPE_RIGHT', { dx, dy, speed });
      else if (speed > 0.34 && dy < -0.12) emitInteraction('PALM_UP', { dx, dy, speed });
    }

    function applyStableGesture(nextGesture, now, palm) {
      if (nextGesture === stableGesture) return;
      stableGesture = nextGesture;
      if (nextGesture === 'OPEN') {
        openSince = now;
        openEventSent = false;
        setInteractionState('OPEN HOLD');
      } else if (nextGesture === 'CLOSED') {
        openSince = 0;
        openEventSent = false;
        handLostSent = false;
        emitInteraction('PALM_CLOSED', { palm });
      } else {
        openSince = 0;
        if (nextGesture === 'UNKNOWN') setInteractionState('UNCERTAIN');
      }
    }

    function processHandResult(result, now) {
      const hands = result.landmarks || [];
      handCount = hands.length;
      if (!hands.length) {
        displayedGesture = 'NO HAND';
        candidateGesture = 'NO HAND'; candidateGestureAt = now;
        holdDurationMs = 0;
        openSince = 0;
        if (lastHandSeenAt && now - lastHandSeenAt >= CONFIG.handExitRearmMs) {
          openEventSent = false;
          stableGesture = 'NO HAND';
          palmHistory = [];
        }
        if (lastHandSeenAt && now - lastHandSeenAt >= CONFIG.handLostEventMs && !handLostSent) {
          handLostSent = true; openSince = 0; openEventSent = false; stableGesture = 'NO HAND';
          emitInteraction('HAND_LOST', {});
        }
        if (lastHandTargetAt && now - lastHandTargetAt > CONFIG.handLossGraceMs) {
          handMarker.visible = false; handHalo.visible = false;
          hasPalmTarget = false;
        }
        if (!handLostSent && (!lastHandSeenAt || now - lastHandSeenAt < CONFIG.handLostEventMs)) setInteractionState('WAITING FOR HAND');
        updateDebug();
        return;
      }

      handLostSent = false;
      lastHandSeenAt = now;
      const { gesture, palm } = classifyHand(hands[0]);
      displayedGesture = gesture;
      if (gesture !== candidateGesture) { candidateGesture = gesture; candidateGestureAt = now; }
      else if (now - candidateGestureAt >= CONFIG.gestureStabilityMs) applyStableGesture(gesture, now, palm);
      if (gesture === 'OPEN' && stableGesture === 'OPEN' && !openSince) openSince = now;

      const mapped = mapPalmToWorld(palm);
      if (mapped) {
